<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<meta name="description" content="KINDRED: friends and community, with age-appropriate spaces.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>KINDRED</title>
<!--
  KINDRED v2 (demo prototype). Sections:
  1 STYLES · 2 MARKUP · 3 ICONS + DEMO DATA · 4 STATE · 5 VIEWS · 6 ROUTER/EVENTS · 7 PWA
  SAFETY: fictional people only; age is self-declared (NOT verification); teens never see
  adult profiles or Dating; Dating tab is a notice-only placeholder for 18+.
-->
<style>
/* ============ 1. STYLES ============ */
:root{
  --navy:#0b1030; --navy2:#151c4a; --navy3:#252e6b;
  --pu:#a78bfa; --pud:#7c5cf0; --pul:#efeaff;
  --bg:#f4f3fb; --card:#fff; --tx:#141838; --mu:#6a6e8e; --ln:#e6e4f4;
  --bad:#c2415a; --ok:#2f9e6e; --r:20px;
  --sh:0 1px 2px rgba(15,21,53,.05),0 8px 24px rgba(15,21,53,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
header.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:12px 18px;padding-top:max(12px,env(safe-area-inset-top));position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.26em;font-size:19px}
.mark{width:28px;height:28px}
.chip{font-size:12px;font-weight:600;background:rgba(167,139,250,.18);color:#d9ceff;padding:5px 11px;border-radius:99px;border:1px solid rgba(167,139,250,.35)}
.chip.adult{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
main{padding:18px 16px 104px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:24px;letter-spacing:-.01em;margin-bottom:2px}
h2{font-size:18px;margin-bottom:6px}
.sub{color:var(--mu);font-size:14px;margin-bottom:16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1;min-width:0}
.avatar{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:none;background:linear-gradient(135deg,var(--a),var(--b))}
.avatar.lg{width:104px;height:104px;border-radius:32px;font-size:36px;margin:0 auto 10px;box-shadow:0 10px 28px rgba(124,92,240,.35)}
.name{font-weight:700}
.meta{color:var(--mu);font-size:13px}
.bio{font-size:14.5px;margin:10px 0 4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:var(--pul);color:var(--pud);font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px}
.tag.hit{background:var(--pud);color:#fff}
.shared{font-size:12px;font-weight:700;color:var(--ok);margin-top:8px}
button{font:inherit;border:0;border-radius:14px;padding:11px 16px;font-weight:650;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .08s}
button:active{transform:scale(.97)}
.bp{background:linear-gradient(135deg,var(--pud),#8f6cf5);color:#fff;box-shadow:0 6px 16px rgba(124,92,240,.3)}
.bs{background:var(--pul);color:var(--pud)}
.bd{background:#fdebef;color:var(--bad)}
.bo{background:transparent;border:1.5px solid var(--ln);color:var(--tx)}
.bt{background:none;color:var(--mu);min-height:36px;padding:6px 10px;font-size:13px;font-weight:600}
.bt.on{color:var(--pud)}
button[disabled]{opacity:.65;box-shadow:none;cursor:default}
.full{width:100%}
.acts{display:flex;gap:8px;margin-top:12px}.acts>button{flex:1}
.mini{display:flex;justify-content:flex-end;gap:2px;margin-top:6px}
label{display:block;font-weight:650;font-size:14px;margin:14px 0 5px}
input,textarea{font:inherit;width:100%;padding:12px 13px;border:1.5px solid var(--ln);border-radius:14px;background:#fff;color:var(--tx)}
input:focus,textarea:focus{outline:2px solid var(--pu);border-color:var(--pu)}
input:disabled{background:var(--bg);color:var(--mu)}
textarea{min-height:84px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;margin-top:14px}
.check input{width:22px;height:22px;flex:none;margin-top:1px}
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--navy);display:flex;padding:4px 6px calc(4px + env(safe-area-inset-bottom));z-index:6;border-radius:22px 22px 0 0}
nav.bottom button{flex:1;background:none;color:#9aa0d0;padding:8px 0 6px;font-size:11px;flex-direction:column;gap:3px;position:relative;border-radius:14px;min-height:56px}
nav.bottom button.on{color:#fff}
nav.bottom button.on::before{content:"";position:absolute;top:2px;width:30px;height:3px;border-radius:3px;background:var(--pu)}
nav.bottom button.on svg{stroke:var(--pu)}
.badge{position:absolute;top:3px;left:calc(50% + 7px);background:var(--pu);color:var(--navy);font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.hero{background:radial-gradient(circle at 80% 0%,#3a3f9c 0,transparent 55%),linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;border-radius:28px;padding:30px 22px 26px;margin-bottom:16px;text-align:center;overflow:hidden}
.hero .mark{width:64px;height:64px;margin-bottom:10px}
.hero .wm{font-weight:800;letter-spacing:.3em;font-size:30px}
.hero p{color:#cfd3f5;margin-top:8px;font-size:15px}
.feats{display:flex;gap:8px;margin-top:20px}
.feat{flex:1;background:rgba(255,255,255,.08);border-radius:16px;padding:12px 6px;font-size:12px;font-weight:600}
.feat svg{display:block;margin:0 auto 6px;color:var(--pu)}
.notice{background:linear-gradient(160deg,var(--navy),var(--navy3));color:#fff;border-radius:24px;padding:26px 20px;text-align:center}
.notice .ring{width:68px;height:68px;border-radius:50%;background:rgba(167,139,250,.2);display:grid;place-items:center;margin:0 auto 12px;color:var(--pu)}
.notice .ring svg{width:32px;height:32px}
.notice p{color:#d3d6f6;font-size:15px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{flex:none;background:#fff;border:1.5px solid var(--ln);color:var(--tx);padding:7px 14px;min-height:36px;border-radius:99px;font-size:13px}
.f.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.gicon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,var(--a),var(--b))}
.cm{background:var(--bg);border-radius:14px;padding:9px 12px;margin-top:8px;font-size:14px}
.cm b{font-size:13px}
.inl{display:flex;gap:8px;margin-top:10px}.inl input{flex:1}.inl button{flex:none}
.back{background:none;color:var(--pud);padding:4px 0;min-height:36px;margin-bottom:6px}
.empty{text-align:center;color:var(--mu);padding:36px 10px}
.empty svg{width:40px;height:40px;color:var(--pu);margin-bottom:8px}
.tip{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--ln);font-size:14px}
.tip:first-of-type{border-top:0}
.tip svg{color:var(--pud);margin-top:2px}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.err{color:var(--bad);font-size:14px;margin-top:10px}
.foot{font-size:12px;color:var(--mu);text-align:center;margin-top:20px}
.seg{display:flex;gap:8px;margin-top:12px}.seg>button{flex:1}
</style>
</head>
<body>
<!-- ============ 2. MARKUP ============ -->
<div id="app">
  <header class="top">
    <div class="logo"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="15" cy="20" r="11" fill="none" stroke="#a78bfa" stroke-width="3.5"/><circle cx="25" cy="20" r="11" fill="none" stroke="#fff" stroke-width="3.5" opacity=".95"/></svg>KINDRED</div>
    <div class="chip" id="chip">Demo</div>
  </header>
  <main id="view"></main>
  <nav class="bottom" id="nav" hidden></nav>
</div>

<script>
/* ============ 3. ICONS + DEMO DATA (all fictional) ============ */
const P = {
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14c2.5 0 4.5 2 4.5 4.5"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M4 7.5l8 5.5 8-5.5"/>',
  chat:'<path d="M5 4.5h14a2 2 0 012 2v9a2 2 0 01-2 2h-8l-5 3.5v-3.5H5a2 2 0 01-2-2v-9a2 2 0 012-2z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 017-2.5A4 4 0 0119 10c0 5.5-7 10-7 10z"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  eye:'<path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

const DATA = {
  teen: {
    people: [
      {id:'t1',name:'Maya R.',age:15,bio:'Sketchbook always in my bag. Looking for art buddies!',interests:['Drawing','Anime','Baking']},
      {id:'t2',name:'Leo K.',age:14,bio:'Robotics club and board games. Ask me about my robot.',interests:['Robotics','Board games','Soccer']},
      {id:'t3',name:'Zara P.',age:16,bio:'Book lover. Reading way too many series at once.',interests:['Reading','Poetry','Piano']},
      {id:'t4',name:'Sam T.',age:17,bio:'Exam prep by day, chess by night.',interests:['Chess','Maths','Cycling']},
      {id:'t5',name:'Ria D.',age:15,bio:'Dance practice every evening. Say hi!',interests:['Dance','Music','Photography']},
      {id:'t6',name:'Theo B.',age:13,bio:'New here. I like space and Minecraft.',interests:['Space','Minecraft','Drawing']}
    ],
    incoming: [
      {id:'ti1',name:'Noah C.',age:16,bio:'Cricket and coding. Looking for a study group.',interests:['Cricket','Coding','Maths']},
      {id:'ti2',name:'Ivy M.',age:14,bio:'I make tiny comics about my cat.',interests:['Comics','Cats','Drawing']}
    ],
    groups: [
      {id:'tg1',icon:'📚',name:'Study Buddies',desc:'Homework help, exam tips and focus sessions.',members:124,posts:[
        {id:'tp1',by:'Sam T.',text:'Anyone up for a 25-minute focus sprint tonight? We can share tips after.',comments:[{by:'Zara P.',text:'I am in! Maths revision for me.'}]},
        {id:'tp2',by:'Leo K.',text:'Best trick for remembering formulas?',comments:[{by:'Maya R.',text:'I draw them as little posters.'},{by:'Sam T.',text:'Flashcards before bed work for me.'}]}]},
      {id:'tg2',icon:'🎮',name:'Game Night',desc:'Friendly, age-appropriate games and board-game chat.',members:98,posts:[
        {id:'tp3',by:'Theo B.',text:'Favorite co-op game that is easy to learn?',comments:[{by:'Leo K.',text:'Try a build-and-survive game with friends!'}]}]},
      {id:'tg3',icon:'🎨',name:'Art Corner',desc:'Share drawings and get kind feedback.',members:76,posts:[
        {id:'tp4',by:'Maya R.',text:'Posted my first watercolor sky. Be gentle, haha.',comments:[{by:'Ria D.',text:'Love the colors!'}]}]},
      {id:'tg4',icon:'📖',name:'Book Club',desc:'One book a month. Spoiler tags please.',members:61,posts:[
        {id:'tp5',by:'Zara P.',text:'Vote for next month: mystery or fantasy?',comments:[]}]}
    ]
  },
  adult: {
    people: [
      {id:'a1',name:'Priya S.',age:27,bio:'Product designer. Weekend hiker and coffee snob.',interests:['Hiking','Design','Coffee']},
      {id:'a2',name:'Marcus L.',age:31,bio:'Teacher by day, amateur baker by night.',interests:['Baking','Podcasts','Running']},
      {id:'a3',name:'Elena V.',age:24,bio:'New in town. Would love to find a book club.',interests:['Reading','Yoga','Travel']},
      {id:'a4',name:'Daniel O.',age:35,bio:'Software dev. Board games and bad puns.',interests:['Board games','Cooking','Cycling']},
      {id:'a5',name:'Aisha K.',age:29,bio:'Nurse. Looking for a gym or swim buddy.',interests:['Swimming','Gardening','Films']},
      {id:'a6',name:'Tom H.',age:41,bio:'Dad of two. Always up for a weekend park meetup.',interests:['Football','Grilling','Photography']}
    ],
    incoming: [
      {id:'ai1',name:'Jordan P.',age:28,bio:'Freelance writer, new to the area.',interests:['Writing','Running','Coffee']},
      {id:'ai2',name:'Sofia G.',age:33,bio:'Into cooking classes and weekend markets.',interests:['Cooking','Markets']}
    ],
    groups: [
      {id:'ag1',icon:'💼',name:'Career Talk',desc:'Advice, interview tips and career pivots.',members:212,posts:[
        {id:'ap1',by:'Marcus L.',text:'How do you ask for feedback without sounding anxious?',comments:[{by:'Priya S.',text:'Ask for one specific thing to improve.'}]}]},
      {id:'ag2',icon:'🏃',name:'Fitness Friends',desc:'Runs, swims and gym accountability.',members:158,posts:[
        {id:'ap2',by:'Aisha K.',text:'Saturday morning group walk, all paces welcome.',comments:[{by:'Daniel O.',text:'Count me in!'}]}]},
      {id:'ag3',icon:'🍳',name:'Cooking Circle',desc:'Recipes, swaps and kitchen disasters.',members:134,posts:[
        {id:'ap3',by:'Elena V.',text:'Your go-to 20-minute dinner?',comments:[]}]},
      {id:'ag4',icon:'🌳',name:'Local Meetups',desc:'Casual public meetups: parks, cafes, markets.',members:89,posts:[
        {id:'ap4',by:'Tom H.',text:'Park picnic next weekend. Bring snacks and a frisbee.',comments:[{by:'Jordan P.',text:'Sounds fun.'}]}]}
    ]
  }
};
const PAL = [['#7c5cf0','#a78bfa'],['#3b5bdb','#7c9cff'],['#a35bd6','#d49cff'],['#4c6ef5','#9bb0ff'],['#6d4de0','#b79dff'],['#2a3470','#6b78d6']];

/* ============ 4. STATE ============ */
const KEY = 'kindred-demo-v2';
const fresh = () => ({user:null, sent:{}, resolved:{}, joined:{}, comments:{}, newPosts:{}, likes:{}, blocked:{}, filter:'All'});
let S = (() => { try{ return Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){ return fresh(); } })();
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const band = () => S.user && S.user.age >= 18 ? 'adult' : 'teen';
const D = () => DATA[band()];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash = s => [...s].reduce((a,c)=>a+c.charCodeAt(0),0);
const initials = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?';
const avatar = (n, cls='') => { const [a,b]=PAL[hash(n)%PAL.length]; return `<div class="avatar ${cls}" style="--a:${a};--b:${b}" aria-hidden="true">${esc(initials(n))}</div>`; };
const mine = () => (S.user.interests||[]).map(x=>x.toLowerCase());
const tags = (arr, hl=true) => `<div class="tags">${arr.map(t=>`<span class="tag ${hl&&mine().includes(t.toLowerCase())?'hit':''}">${esc(t)}</span>`).join('')}</div>`;
const sharedCount = p => p.interests.filter(t=>mine().includes(t.toLowerCase())).length;
const pending = () => D().incoming.filter(p => !S.resolved[p.id] && !S.blocked[p.id]);
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
const foot = () => `<p class="foot">Demo only · fictional people · nothing leaves this device</p>`;

/* ============ 5. VIEWS ============ */
const personCard = (p, extra) => {
  const sc = sharedCount(p);
  return `<div class="card"><div class="row">${avatar(p.name)}
    <div class="grow"><div class="name">${esc(p.name)}</div><div class="meta">Age ${p.age}</div></div></div>
    <p class="bio">${esc(p.bio)}</p>${tags(p.interests)}
    ${sc?`<div class="shared">✓ ${sc} shared interest${sc>1?'s':''} with you</div>`:''}
    ${extra}
    <div class="mini"><button class="bt" data-act="report" data-id="${p.id}">${ic('flag')}Report</button><button class="bt" data-act="block" data-id="${p.id}">${ic('ban')}Block</button></div></div>`;
};

const Views = {
  welcome(){
    return `<div class="hero">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="15" cy="20" r="11" fill="none" stroke="#a78bfa" stroke-width="3.2"/><circle cx="25" cy="20" r="11" fill="none" stroke="#fff" stroke-width="3.2"/></svg>
      <div class="wm">KINDRED</div><p>Find your people. Friends and community, in spaces made for your age.</p>
      <div class="feats"><div class="feat">${ic('users')}Friends</div><div class="feat">${ic('chat')}Community</div><div class="feat">${ic('shield')}Safe spaces</div></div></div>
    <div class="card"><h2>Demo sign-in</h2>
      <p class="meta">No email, password, phone or ID. Use a nickname, not your real name.</p>
      <form id="signin" autocomplete="off">
        <label for="nick">Nickname</label><input id="nick" maxlength="24" placeholder="e.g. Sky" required>
        <label for="age">Age</label><input id="age" type="number" min="1" max="99" inputmode="numeric" placeholder="Your age" required>
        <label class="check"><input type="checkbox" required><span>I understand this is a demo with fictional people, and I will not share personal details.</span></label>
        <div class="err" id="err" role="alert"></div>
        <button class="bp full" style="margin-top:14px">Enter KINDRED</button></form>
      <div class="seg"><button class="bs" data-act="demo" data-age="15">Try as teen</button><button class="bs" data-act="demo" data-age="27">Try as adult</button></div>
      <p class="foot" style="margin-top:12px">Age is self-declared in this demo. Real verification is not built yet.</p></div>`;
  },

  friends(){
    const all = D().people.filter(p=>!S.blocked[p.id]);
    const cats = ['All', ...new Set(all.flatMap(p=>p.interests))].slice(0,10);
    const list = all.filter(p => S.filter==='All' || p.interests.includes(S.filter))
      .sort((a,b)=>sharedCount(b)-sharedCount(a))
      .map(p => { const st=S.sent[p.id];
        return personCard(p, `<div class="acts"><button class="${st?'bs':'bp'}" data-act="send" data-id="${p.id}" ${st?'disabled':''}>${st?ic('check')+'Request sent':'Send Request'}</button></div>`); }).join('');
    const fr = D().incoming.filter(p=>S.resolved[p.id]==='accepted');
    return `<h1>Hi, ${esc(S.user.name)} 👋</h1><p class="sub">Friends for ${band()==='adult'?'adults (18+)':'teens (13–17)'}. Add interests in Profile to see better matches.</p>
      <div class="filters">${cats.map(c=>`<button class="f ${S.filter===c?'on':''}" data-act="filter" data-id="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      ${list || `<div class="empty">${ic('users')}<br>No one for this filter.</div>`}
      ${fr.length?`<h2 style="margin-top:10px">Your friends</h2>`+fr.map(p=>`<div class="card row">${avatar(p.name)}<div class="grow"><div class="name">${esc(p.name)}</div><div class="meta">Friends · Age ${p.age}</div></div>${ic('check')}</div>`).join(''):''}${foot()}`;
  },

  requests(){
    const items = pending();
    return `<h1>Requests</h1><p class="sub">You decide who connects with you.</p>` + (items.length ? items.map(p =>
      personCard(p, `<div class="acts"><button class="bp" data-act="accept" data-id="${p.id}">${ic('check')}Accept</button><button class="bd" data-act="decline" data-id="${p.id}">${ic('x')}Decline</button></div>`)).join('')
      : `<div class="empty">${ic('mail')}<br>All caught up.<br>No pending requests.</div>`) + foot();
  },

  community(){
    return `<h1>Community</h1><p class="sub">Topic groups for ${band()==='adult'?'adults':'teens'}. Be kind, stay on topic.</p>` + D().groups.map(g => {
      const [a,b]=PAL[hash(g.name)%PAL.length];
      return `<div class="card"><div class="row"><div class="gicon" style="--a:${a}33;--b:${b}55">${g.icon}</div>
        <div class="grow"><div class="name">${esc(g.name)}</div><div class="meta">${g.members+(S.joined[g.id]?1:0)} members · ${g.posts.length+(S.newPosts[g.id]||[]).length} posts</div></div></div>
        <p class="bio">${esc(g.desc)}</p>
        <div class="acts"><button class="bo" data-act="open" data-id="${g.id}">View posts</button>
        <button class="${S.joined[g.id]?'bs':'bp'}" data-act="join" data-id="${g.id}">${S.joined[g.id]?ic('check')+'Joined':'Join'}</button></div></div>`; }).join('') + foot();
  },

  group(id){
    const g = D().groups.find(x=>x.id===id); if(!g) return Views.community();
    const posts = [...(S.newPosts[id]||[]), ...g.posts];
    return `<button class="back" data-act="back">← All groups</button><h1>${g.icon} ${esc(g.name)}</h1><p class="sub">${esc(g.desc)}</p>
      <form class="card" data-form="post" data-id="${id}"><label for="np" style="margin-top:0">Share something</label>
        <textarea id="np" maxlength="300" placeholder="Be friendly. Never post phone numbers, address or school." required></textarea>
        <button class="bp full" style="margin-top:10px">${ic('plus')}Post to group</button></form>` +
      posts.map(p => { const cs=[...p.comments,...(S.comments[p.id]||[])], liked=S.likes[p.id], n=(hash(p.id)%7)+1+(liked?1:0);
        return `<div class="card"><div class="row">${avatar(p.by)}<div class="grow"><div class="name">${esc(p.by)}</div></div></div>
          <p class="bio">${esc(p.text)}</p>
          <div class="row" style="margin-top:6px"><button class="bt ${liked?'on':''}" data-act="like" data-id="${p.id}">${ic('heart')}${n}</button><span class="meta">${cs.length} comment${cs.length===1?'':'s'}</span></div>
          ${cs.map(c=>`<div class="cm"><b>${esc(c.by)}</b><br>${esc(c.text)}</div>`).join('')}
          <form class="inl" data-form="comment" data-id="${p.id}"><input maxlength="200" placeholder="Add a comment…" aria-label="Comment" required><button class="bp">Post</button></form></div>`; }).join('') + foot();
  },

  profile(){
    const u = S.user;
    return `<h1>Your profile</h1><p class="sub">Share only what you are comfortable with.</p>
      <div class="card" style="text-align:center">${avatar(u.name,'lg')}<div class="meta">Profile photo placeholder (no uploads in this demo)</div>
        <div class="tag" style="display:inline-block;margin-top:10px">${band()==='adult'?'Adult space · 18+':'Teen space · 13–17'}</div></div>
      <form class="card" id="profile"><label for="pn" style="margin-top:0">Display name</label><input id="pn" maxlength="24" value="${esc(u.name)}" required>
        <label>Age</label><input value="${u.age}" disabled>
        <label for="pb">Bio</label><textarea id="pb" maxlength="160" placeholder="A few words about you">${esc(u.bio||'')}</textarea>
        <label for="pi">Interests (comma separated)</label><input id="pi" maxlength="80" value="${esc((u.interests||[]).join(', '))}" placeholder="Drawing, Chess, Music">
        <button class="bp full" style="margin-top:16px">Save profile</button></form>
      <div class="card"><h2>${ic('shield')} Safety tips</h2>
        <div class="tip">${ic('eye')}<span>Never share your phone number, address, school or passwords.</span></div>
        <div class="tip">${ic('flag')}<span>See something wrong? Use Report on any profile.</span></div>
        <div class="tip">${ic('ban')}<span>Block anyone who makes you uncomfortable.</span></div>
        <div class="tip">${ic('users')}<span>Tell a trusted adult if something feels off.</span></div></div>
      <button class="bo full" data-act="signout">Sign out and reset demo</button>${foot()}`;
  },

  dating(){
    return `<h1>Dating</h1><p class="sub">Adults only</p>
      <div class="notice"><div class="ring">${ic('lock')}</div><h2>Dating is for adults aged 18+ only</h2>
        <p>This is a placeholder. This prototype has no dating profiles, matching or messaging, and none will ever be shown to anyone under 18.</p></div>
      <div class="card" style="margin-top:14px"><p class="bio" style="margin:0">Your Friends and Community spaces stay completely separate from this section.</p></div>${foot()}`;
  }
};

/* ============ 6. ROUTER / EVENTS ============ */
const NAV = [['friends','users','Friends'],['requests','mail','Requests'],['community','chat','Community'],['profile','user','Profile'],['dating','lock','Dating 18+',true]];

function route(){
  const h = (location.hash||'').slice(1) || 'friends', nav=$('#nav'), view=$('#view'), chip=$('#chip');
  if(!S.user){ nav.hidden=true; chip.className='chip'; chip.textContent='Demo'; view.innerHTML=Views.welcome(); return; }
  const [base,arg] = h.split('/');
  if(base==='dating' && band()!=='adult'){ location.hash='#friends'; return; }   // safety guard
  const cur = ['friends','requests','community','profile','dating'].includes(base) ? base : 'friends';
  chip.className = 'chip'+(band()==='adult'?' adult':''); chip.textContent = band()==='adult'?'Adult · 18+':'Teen · 13–17';
  view.innerHTML = (cur==='community'&&arg) ? Views.group(arg) : Views[cur]();
  view.style.animation='none'; void view.offsetWidth; view.style.animation='';
  nav.hidden=false;
  nav.innerHTML = NAV.filter(n=>!n[3]||band()==='adult').map(([r,i,t])=>{ const c=r==='requests'?pending().length:0;
    return `<button data-go="${r}" class="${r===cur?'on':''}" aria-label="${t}">${ic(i)}${t}${c?`<span class="badge">${c}</span>`:''}</button>`; }).join('');
  window.scrollTo(0,0);
}
function signIn(name, age){ S=fresh(); S.user={name,age,bio:'',interests:[]}; save(); location.hash='#friends'; route(); }

document.addEventListener('click', e => {
  const go=e.target.closest('[data-go]'); if(go){ location.hash='#'+go.dataset.go; return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const {act,id}=b.dataset;
  if(act==='demo'){ const a=+b.dataset.age; signIn(a>=18?'DemoAdult':'DemoTeen', a); return; }
  if(act==='send'){ S.sent[id]=true; toast('Request sent (demo)'); }
  else if(act==='accept'){ S.resolved[id]='accepted'; toast('Friend added'); }
  else if(act==='decline'){ S.resolved[id]='declined'; toast('Request declined'); }
  else if(act==='join'){ S.joined[id]=!S.joined[id]; }
  else if(act==='like'){ S.likes[id]=!S.likes[id]; }
  else if(act==='filter'){ S.filter=id; }
  else if(act==='report'){ toast('Reported. Thanks for keeping KINDRED safe (demo)'); return; }
  else if(act==='block'){ S.blocked[id]=true; toast('Blocked. You will not see them again'); }
  else if(act==='open'){ location.hash='#community/'+id; return; }
  else if(act==='back'){ location.hash='#community'; return; }
  else if(act==='signout'){ S=fresh(); save(); location.hash=''; route(); return; }
  save(); const y=window.scrollY; route(); if(['like','filter','join'].includes(act)) window.scrollTo(0,y);
});

document.addEventListener('submit', e => {
  e.preventDefault(); const f=e.target;
  if(f.id==='signin'){
    const name=$('#nick').value.trim(), age=parseInt($('#age').value,10), err=$('#err');
    if(!name){ err.textContent='Please choose a nickname.'; return; }
    if(!(age>=1&&age<=99)){ err.textContent='Please enter a valid age.'; return; }
    if(age<13){ err.textContent='KINDRED is for ages 13 and up. Please ask a parent or guardian about safe options for you.'; return; }
    signIn(name,age); return;
  }
  if(f.id==='profile'){
    S.user.name=$('#pn').value.trim()||S.user.name; S.user.bio=$('#pb').value.trim();
    S.user.interests=$('#pi').value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,8);
    save(); toast('Profile saved'); route(); return;
  }
  if(f.dataset.form==='comment'){ const v=f.querySelector('input').value.trim(); if(!v) return;
    (S.comments[f.dataset.id]=S.comments[f.dataset.id]||[]).push({by:S.user.name,text:v}); save(); route(); return; }
  if(f.dataset.form==='post'){ const v=f.querySelector('textarea').value.trim(); if(!v) return;
    (S.newPosts[f.dataset.id]=S.newPosts[f.dataset.id]||[]).unshift({id:'n'+Date.now(),by:S.user.name,text:v,comments:[]}); save(); toast('Posted'); route(); }
});
window.addEventListener('hashchange', route);
route();

/* ============ 7. PWA (installable app) ============ */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
