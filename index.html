<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a1f" id="tc">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="description" content="KINDRED: friends and community, with age-appropriate spaces.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>KINDRED</title>
<!--
  KINDRED v3 (demo prototype)
  SECTIONS: 1 STYLES · 2 MARKUP · 3 ICONS + DEMO DATA · 4 STATE · 5 HELPERS · 6 COMPONENTS · 7 VIEWS · 8 SHEETS · 9 ROUTER/EVENTS · 10 PWA
  SAFETY RULES BUILT IN
   - Fictional people only. Age is self-declared (NOT verification).
   - Teens (13-17) only see teen people/groups. Adults only see adult ones.
   - Dating tab exists only for 18+ and is a notice-only placeholder.
   - No location, distance, phone, email, photo upload, or real messaging anywhere.
   - Teens cannot set profile visibility to Public.
   - Content-Security-Policy meta tag limits what the page may load or run.
-->
<style>
/* ============ 1. STYLES ============ */
:root{--pu:#a78bfa;--pud:#7c5cf0;--mint:#5eead4;--r:22px;--glow:rgba(124,92,240,.4);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[data-theme=dark]{--bg:#070a1f;--bg2:#0e1336;--card:rgba(255,255,255,.055);--solid:#121842;--tx:#f3f4ff;--mu:#9aa0cc;
  --ln:rgba(255,255,255,.1);--nav:rgba(18,24,66,.88);--inp:rgba(255,255,255,.07);--pul:rgba(167,139,250,.16);
  --tagc:#cbbcff;--mintc:#5eead4;--badbg:rgba(255,107,139,.14);--badc:#ff8fa8;--glow1:rgba(124,92,240,.3);
  --sh:0 10px 30px rgba(0,0,0,.35)}
[data-theme=light]{--bg:#f4f3fb;--bg2:#fff;--card:#fff;--solid:#fff;--tx:#141838;--mu:#6a6e8e;
  --ln:#e6e4f4;--nav:rgba(255,255,255,.94);--inp:#fff;--pul:#efeaff;
  --tagc:#7c5cf0;--mintc:#0f8f7e;--badbg:#fdebef;--badc:#c2415a;--glow1:rgba(124,92,240,.16);
  --sh:0 10px 30px rgba(15,21,53,.09)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--font);background:radial-gradient(560px 400px at 100% -60px,var(--glow1),transparent 70%),var(--bg);color:var(--tx);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;transition:background-color .25s,color .25s}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;padding-top:max(12px,env(safe-area-inset-top));background:linear-gradient(var(--bg) 55%,transparent);backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.28em;font-size:18px}
.mark{width:30px;height:30px}
.chip{font-size:12px;font-weight:700;color:var(--tagc);background:var(--pul);padding:6px 12px;border-radius:99px;border:1px solid var(--ln)}
main{padding:10px 16px 118px}
h1{font-size:26px;letter-spacing:-.02em;line-height:1.15;margin-bottom:4px}
h2{font-size:18px;letter-spacing:-.01em;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.sub{color:var(--mu);font-size:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh);backdrop-filter:blur(12px)}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}
.name{font-weight:700}.meta{color:var(--mu);font-size:13px}.mint{color:var(--mintc);font-weight:700}
.bio{font-size:14.5px;margin:10px 0 4px}
.avatar{width:50px;height:50px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:none;background:linear-gradient(135deg,var(--a),var(--b))}
.avatar.sm{width:32px;height:32px;font-size:12px}.avatar.xl{width:100px;height:100px;font-size:34px}
.avatar.ring{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--pu),0 10px 30px var(--glow)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:var(--pul);color:var(--tagc);font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px}
.tag.hit{background:var(--pud);color:#fff}
.shared{font-size:12px;font-weight:700;color:var(--mintc);margin-top:8px}
button{font:inherit;color:inherit;border:0;border-radius:14px;padding:11px 16px;font-weight:650;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .08s,opacity .2s}
button:active{transform:scale(.97)}
.bp{background:linear-gradient(135deg,var(--pud),#9b7bff);color:#fff;box-shadow:0 8px 20px var(--glow)}
.bs{background:var(--pul);color:var(--tagc)}
.bd{background:var(--badbg);color:var(--badc)}
.bo{background:transparent;border:1.5px solid var(--ln)}
.bt{background:none;color:var(--mu);min-height:36px;padding:6px 10px;font-size:13px;font-weight:600}
.bt.on{color:var(--pu)}.bt.on svg{fill:var(--pu)}
.lnk{background:none;color:var(--tagc);padding:0;min-height:0;font-size:13px;font-weight:700;display:inline}
button[disabled]{opacity:.6;box-shadow:none;cursor:default}
.full{width:100%}.acts{display:flex;gap:8px;margin-top:12px}.acts>button{flex:1}
.mini{display:flex;justify-content:flex-end;gap:2px;margin-top:6px}
label{display:block;font-weight:650;font-size:14px;margin:14px 0 6px}
input,textarea{font:inherit;width:100%;padding:13px 14px;border:1.5px solid var(--ln);border-radius:16px;background:var(--inp);color:var(--tx)}
input::placeholder,textarea::placeholder{color:var(--mu)}
input:focus,textarea:focus{outline:2px solid var(--pu);border-color:var(--pu)}
input:disabled{opacity:.6}textarea{min-height:84px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;margin-top:14px}
.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--pud)}
.err{color:var(--badc);font-size:14px;margin-top:10px}
.foot{font-size:12px;color:var(--mu);text-align:center;margin-top:20px}
/* nav */
nav.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:496px;background:var(--nav);backdrop-filter:blur(18px);border:1px solid var(--ln);border-radius:30px;display:flex;padding:6px;z-index:6;box-shadow:0 14px 40px rgba(0,0,0,.35)}
nav.bottom button{flex:1;background:none;color:var(--mu);flex-direction:column;gap:2px;font-size:10.5px;min-height:54px;border-radius:24px;position:relative;padding:6px 0}
nav.bottom button.on{color:#fff;background:linear-gradient(135deg,var(--pud),#9b7bff);box-shadow:0 8px 20px var(--glow)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--mint);color:#06221e;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* waves + hero */
.waves{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.waves path{fill:none;stroke:var(--wv,#a78bfa);stroke-width:1.1}
.hero{position:relative;border-radius:34px;overflow:hidden;min-height:300px;background:linear-gradient(165deg,#04061a,#150d45 68%,#2a1a7a);color:#fff;display:flex;align-items:flex-end;padding:26px 22px;margin-bottom:16px;box-shadow:var(--sh)}
.hc{position:relative}.hc .mark{width:54px;height:54px;margin-bottom:12px}
.wm{font-weight:800;letter-spacing:.32em;font-size:15px;color:#cbbcff}
.ht{font-size:34px;margin:6px 0 8px}.hc p{color:#cfd3f5;font-size:15px}
.seg{display:flex;gap:8px;margin-top:12px}.seg>button{flex:1}
/* tabs, chips */
.tabs{display:flex;border-bottom:1px solid var(--ln);margin-bottom:14px}
.tabs button{flex:1;background:none;border-radius:0;color:var(--mu);border-bottom:2.5px solid transparent;min-height:46px}
.tabs button.on{color:var(--tx);border-color:var(--pu)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.f{flex:none;background:var(--card);border:1.5px solid var(--ln);padding:7px 15px;min-height:36px;border-radius:99px;font-size:13px}
.f.on{background:var(--pud);color:#fff;border-color:var(--pud)}
/* orbit */
.orbit{position:relative;width:100%;aspect-ratio:1;max-width:400px;margin:6px auto 4px}
.rg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px dashed var(--ln)}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center}
.pulse{position:absolute;width:56px;height:56px;border-radius:50%;background:var(--glow);animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(3.2);opacity:0}}
.node{position:absolute;transform:translate(-50%,-50%);padding:0;background:none;min-height:0;border-radius:50%;animation:floaty 5s ease-in-out infinite}
.node:nth-child(2n){animation-delay:-2s}.node:nth-child(3n){animation-delay:-3.5s}
@keyframes floaty{0%,100%{margin-top:0}50%{margin-top:-5px}}
.node .avatar{width:46px;height:46px;font-size:15px;border:2px solid var(--bg2)}
.pc{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;background:var(--mint);color:#06221e;padding:1px 6px;border-radius:99px}
/* tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{position:relative;aspect-ratio:3/4;border-radius:24px;overflow:hidden;background:linear-gradient(160deg,var(--a),var(--b));cursor:pointer;color:#fff;box-shadow:var(--sh);border:1px solid var(--ln)}
.tile .waves{--wv:#fff;opacity:.28}
.big{position:absolute;inset:0;display:grid;place-items:center;font-size:78px;font-weight:800;opacity:.22;letter-spacing:-.04em}
.mt{position:absolute;top:10px;left:10px;font-size:11px;font-weight:800;background:rgba(7,10,31,.55);backdrop-filter:blur(6px);padding:4px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.25)}
.ov{position:absolute;left:0;right:0;bottom:0;padding:36px 14px 13px;background:linear-gradient(transparent,rgba(5,8,28,.85))}
.tn{font-weight:800;font-size:16px}.ti{font-size:12px;opacity:.85;margin-top:1px;padding-right:44px}
.add{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--pud);padding:0;min-height:0}
.frow{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}.frow::-webkit-scrollbar{display:none}
.fr{background:none;flex-direction:column;gap:6px;padding:0;min-height:0;font-size:12px;color:var(--mu);flex:none}
.fr .avatar{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--pu)}
/* masonry */
.mason{column-count:2;column-gap:12px;margin-bottom:14px}
.mtile{position:relative;break-inside:avoid;margin-bottom:12px;border-radius:24px;overflow:hidden;background:linear-gradient(160deg,var(--a),var(--b));color:#fff;padding:14px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--sh);border:1px solid var(--ln)}
.mtile .waves{--wv:#fff;opacity:.25}.mtile>*{position:relative}.mtile .waves{position:absolute}
.mtile .em{font-size:34px}.mtile .gn{font-weight:800;font-size:16px;line-height:1.2}.mtile .gm{font-size:12px;opacity:.85;margin-bottom:8px}
.mtile button{background:rgba(255,255,255,.95);color:var(--pud);min-height:34px;padding:6px 14px;font-size:13px;border-radius:99px}
.mtile button.joined{background:rgba(7,10,31,.5);color:#fff}
/* group header, posts */
.gh{position:relative;border-radius:28px;overflow:hidden;padding:22px 18px;color:#fff;background:linear-gradient(150deg,var(--a),var(--b));margin-bottom:14px;box-shadow:var(--sh)}
.gh .waves{--wv:#fff;opacity:.28}.gh>*{position:relative}.gh .waves{position:absolute}
.back{background:none;color:var(--tagc);padding:4px 0;min-height:36px;margin-bottom:6px}
.cmt{display:flex;gap:8px;margin-top:10px;align-items:flex-start}
.bub{background:var(--inp);border:1px solid var(--ln);border-radius:4px 16px 16px 16px;padding:8px 12px;font-size:14px;max-width:85%}
.bub b{display:block;font-size:12px;color:var(--mu);font-weight:700}
.cmt.me{flex-direction:row-reverse}.cmt.me .bub{background:linear-gradient(135deg,var(--pud),#9b7bff);color:#fff;border:0;border-radius:16px 4px 16px 16px}.cmt.me .bub b{color:#e6dcff}
.inl{display:flex;gap:8px;margin-top:12px}.inl input{flex:1}.inl button{flex:none;padding:0 16px}
/* profile */
.banner{position:relative;height:150px;border-radius:30px;overflow:hidden;background:linear-gradient(135deg,#070a24,#2b1a80)}
.gear{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;padding:0;backdrop-filter:blur(8px)}
.pfh{text-align:center;margin:-52px 0 16px;position:relative}
.pfh .avatar{margin-bottom:10px}
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;text-align:center;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:12px 4px}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mu)}
/* settings */
.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}.set:first-of-type{border-top:0}
.set svg{color:var(--pu)}
.tg{width:52px;height:32px;border-radius:32px;background:var(--ln);position:relative;padding:0;min-height:0;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tg[aria-checked=true]{background:var(--pud)}.tg[aria-checked=true]::after{left:24px}
.opt{width:100%;text-align:left;justify-content:space-between;background:var(--inp);border:1.5px solid var(--ln);border-radius:18px;margin-top:8px;padding:12px 14px;font-weight:600;font-size:15px;flex-direction:row}
.opt small{display:block;font-weight:400;color:var(--mu);font-size:13px;margin-top:2px}
.opt.on{border-color:var(--pu);background:var(--pul)}.opt.on svg{color:var(--pu)}
.tip{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--ln);font-size:14px}.tip:first-of-type{border-top:0}.tip svg{color:var(--pu);margin-top:2px}
.privnote{display:flex;gap:10px;align-items:center;background:var(--pul);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--tagc);margin:12px 0}
.notice{position:relative;overflow:hidden;background:linear-gradient(160deg,#04061a,#1a1060);color:#fff;border-radius:30px;padding:34px 22px;text-align:center}
.notice>*{position:relative}.notice .ring{width:72px;height:72px;border-radius:50%;background:rgba(167,139,250,.22);display:grid;place-items:center;margin:0 auto 14px;color:#cbbcff}
.notice .ring svg{width:32px;height:32px}.notice h2{justify-content:center}.notice p{color:#d3d6f6;font-size:15px}
.empty{text-align:center;color:var(--mu);padding:34px 10px}.empty svg{width:42px;height:42px;color:var(--pu);margin-bottom:8px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--solid);color:var(--tx);border:1px solid var(--ln);padding:11px 18px;border-radius:99px;font-size:14px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:92%;text-align:center}
/* sheet */
#sheet .bg{position:fixed;inset:0;background:rgba(3,5,20,.62);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet .sh{width:100%;max-width:520px;background:var(--solid);border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;border:1px solid var(--ln);border-bottom:0}
#sheet .anim{animation:fadeIn .2s}#sheet .anim .sh{animation:up .28s ease}
.grab{width:42px;height:5px;border-radius:5px;background:var(--ln);margin:6px auto 16px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
main.rise{animation:rise .3s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- ============ 2. MARKUP ============ -->
<div id="app">
  <header class="top">
    <div class="logo"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="15" cy="20" r="11" fill="none" stroke="#a78bfa" stroke-width="3.5"/><circle cx="25" cy="20" r="11" fill="none" stroke="currentColor" stroke-width="3.5"/></svg>KINDRED</div>
    <div class="chip" id="chip">Demo</div>
  </header>
  <main id="view"></main>
  <nav class="bottom" id="nav" hidden></nav>
</div>
<div id="sheet"></div>

<script>
/* ============ 3. ICONS + DEMO DATA (all fictional) ============ */
const P={
 users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14c2.5 0 4.5 2 4.5 4.5"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M4 7.5l8 5.5 8-5.5"/>',
 chat:'<path d="M5 4.5h14a2 2 0 012 2v9a2 2 0 01-2 2h-8l-5 3.5v-3.5H5a2 2 0 01-2-2v-9a2 2 0 012-2z"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/>',
 heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 017-2.5A4 4 0 0119 10c0 5.5-7 10-7 10z"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
 flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
 ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 eye:'<path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
 moon:'<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',
 bell:'<path d="M6 16v-5a6 6 0 0112 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 004 0"/>',
 send:'<path d="M4 12l16-8-6 16-3-7z"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 pin:'<path d="M12 21s-6-5.5-6-10a6 6 0 0112 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

const DATA={
 teen:{
  people:[
   {id:'t1',name:'Maya R.',age:15,bio:'Sketchbook always in my bag. Looking for art buddies!',interests:['Drawing','Anime','Baking']},
   {id:'t2',name:'Leo K.',age:14,bio:'Robotics club and board games. Ask me about my robot.',interests:['Robotics','Board games','Soccer']},
   {id:'t3',name:'Zara P.',age:16,bio:'Book lover. Reading way too many series at once.',interests:['Reading','Poetry','Piano']},
   {id:'t4',name:'Sam T.',age:17,bio:'Exam prep by day, chess by night.',interests:['Chess','Maths','Cycling']},
   {id:'t5',name:'Ria D.',age:15,bio:'Dance practice every evening. Say hi!',interests:['Dance','Music','Photography']},

const PAL=[['#5b3fd6','#a78bfa'],['#2b3fa8','#6f8cff'],['#8a3fc7','#d58bff'],['#1d6fa5','#5ec8e8'],['#b0438a','#ff9ccb'],['#2a2f7a','#7a6cf0']];
const AGO=['12m','1h','2h','3h','5h','1d'];

/* ============ 4. STATE ============ */
const KEY='kindred-demo-v2';
const fresh=()=>({user:null,sent:{},resolved:{},joined:{},comments:{},newPosts:{},likes:{},blocked:{},filter:'All',ctab:'foryou',
  settings:{vis:'friends',reqs:'all',notif:true,theme:'dark'}});
let S=(()=>{try{const o=JSON.parse(localStorage.getItem(KEY)||'{}');const m=Object.assign(fresh(),o);m.settings=Object.assign(fresh().settings,o.settings||{});return m}catch(e){return fresh()}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const resetKeepTheme=()=>{const t=S.settings.theme;S=fresh();S.settings.theme=t};
const band=()=>S.user&&S.user.age>=18?'adult':'teen';
const D=()=>DATA[band()];
let SHEET=null;   // {k:'person'|'report', id}

/* ============ 5. HELPERS ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0);
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'?';
const pal=n=>PAL[hash(n)%PAL.length];
const avatar=(n,cls='')=>{const[a,b]=pal(n);return `<span class="avatar ${cls}" style="--a:${a};--b:${b}" aria-hidden="true">${esc(initials(n))}</span>`};
const mine=()=>(S.user.interests||[]).map(x=>x.toLowerCase());
const sharedCount=p=>p.interests.filter(t=>mine().includes(t.toLowerCase())).length;
const matchPct=p=>{const m=mine();if(!m.length)return 0;return Math.round(100*sharedCount(p)/Math.min(m.length,p.interests.length))};
const tags=a=>`<div class="tags">${a.map(t=>`<span class="tag ${mine().includes(t.toLowerCase())?'hit':''}">${esc(t)}</span>`).join('')}</div>`;
const everyone=()=>[...D().people,...D().incoming];
const findPerson=id=>everyone().find(p=>p.id===id);
const blockedList=()=>everyone().filter(p=>S.blocked[p.id]);
const pending=()=>D().incoming.filter(p=>!S.resolved[p.id]&&!S.blocked[p.id]);
const friendsList=()=>D().incoming.filter(p=>S.resolved[p.id]==='accepted'&&!S.blocked[p.id]);
function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const foot=()=>`<p class="foot">Demo only · fictional people · nothing leaves this device</p>`;
function waves(n=10,w=400,h=300,seed=1){
  let g='';
  for(let i=0;i<n;i++){
    const y=h*.08+i*(h*.84/Math.max(1,n-1)),a=10+((i+seed)%5)*5,ph=seed*1.3+i*.5;
    let d='M-10 '+y.toFixed(1);
    for(let x=0;x<=w+20;x+=14)d+=' L'+x+' '+(y+Math.sin(x/48+ph)*a+Math.cos(x/110+ph*1.6)*a*.9).toFixed(1);
    g+=`<path d="${d}" stroke-opacity="${(.18+.55*Math.abs(Math.sin(i*1.3+seed))).toFixed(2)}"/>`;
  }
  return `<svg class="waves" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${g}</svg>`;
}

/* ============ 6. COMPONENTS ============ */
function tile(p){
  const[a,b]=pal(p.name),pc=matchPct(p),st=S.sent[p.id];
  return `<div class="tile" style="--a:${a};--b:${b}" data-act="person" data-id="${p.id}" role="button" tabindex="0" aria-label="View ${esc(p.name)}">
    ${waves(7,300,400,hash(p.name)%9)}<span class="big">${esc(initials(p.name))}</span>
    <span class="mt">${pc?pc+'% match':'New'}</span>
    <div class="ov"><div class="tn">${esc(p.name.split(' ')[0])}, ${p.age}</div><div class="ti">${esc(p.interests.slice(0,2).join(' · '))}</div></div>
    <button class="add" data-act="send" data-id="${p.id}" aria-label="Send request to ${esc(p.name)}" ${st?'disabled':''}>${ic(st?'check':'plus')}</button></div>`;
}
function orbit(list){
  const spots=[[19,215],[19,35],[30,300],[30,120],[40,170],[40,350]];
  const nodes=list.slice(0,6).map((p,i)=>{const[r,a]=spots[i],rad=a*Math.PI/180,pc=matchPct(p);
    return `<button class="node" style="left:${(50+r*Math.cos(rad)).toFixed(1)}%;top:${(50+r*Math.sin(rad)).toFixed(1)}%" data-act="person" data-id="${p.id}" aria-label="${esc(p.name)}">${avatar(p.name)}${pc?`<span class="pc">${pc}%</span>`:''}</button>`}).join('');
  return `<div class="orbit"><i class="rg" style="width:38%;height:38%"></i><i class="rg" style="width:60%;height:60%"></i><i class="rg" style="width:80%;height:80%"></i>
    <div class="core"><span class="pulse"></span>${avatar(S.user.name,'ring')}</div>${nodes}</div>`;
}
const bubble=c=>`<div class="cmt ${S.user&&c.by===S.user.name?'me':''}">${avatar(c.by,'sm')}<div class="bub"><b>${esc(c.by)}</b>${esc(c.text)}</div></div>`;
function postCard(p,g,showGroup){
  const cs=[...p.comments,...(S.comments[p.id]||[])],liked=S.likes[p.id],n=(hash(p.id)%7)+1+(liked?1:0);
  const when=p.id[0]==='n'?'just now':AGO[hash(p.id)%AGO.length]+' ago';
  return `<article class="card"><div class="row">${avatar(p.by)}<div class="grow"><div class="name">${esc(p.by)}</div>
    <div class="meta">${when}${showGroup?` · <button class="lnk" data-act="open" data-id="${g.id}">${g.icon} ${esc(g.name)}</button>`:''}</div></div></div>
    <p class="bio">${esc(p.text)}</p>
    <div class="row" style="margin-top:4px"><button class="bt ${liked?'on':''}" data-act="like" data-id="${p.id}" aria-label="Like">${ic('heart')}${n}</button><span class="meta">${cs.length} comment${cs.length===1?'':'s'}</span></div>
    ${cs.map(bubble).join('')}
    <form class="inl" data-form="comment" data-id="${p.id}"><input maxlength="200" placeholder="Add a comment…" aria-label="Comment" required><button class="bp" aria-label="Post comment">${ic('send')}</button></form></article>`;
}
function reqCard(p){
  const sc=sharedCount(p);
  return `<div class="card"><div class="row" data-act="person" data-id="${p.id}" style="cursor:pointer">${avatar(p.name)}<div class="grow"><div class="name">${esc(p.name)}</div><div class="meta">Age ${p.age} · wants to connect</div></div></div>
    <p class="bio">${esc(p.bio)}</p>${tags(p.interests)}${sc?`<div class="shared">✓ ${sc} shared interest${sc>1?'s':''} with you</div>`:''}
    <div class="acts"><button class="bp" data-act="accept" data-id="${p.id}">${ic('check')}Accept</button><button class="bd" data-act="decline" data-id="${p.id}">${ic('x')}Decline</button></div>
    <div class="mini"><button class="bt" data-act="report" data-id="${p.id}">${ic('flag')}Report</button><button class="bt" data-act="block" data-id="${p.id}">${ic('ban')}Block</button></div></div>`;
}

 dating(){
  return `<h1>Dating</h1><p class="sub">Adults only</p>
   <div class="notice">${waves(12,400,300,4)}<div class="ring">${ic('lock')}</div><h2>Dating is for adults aged 18+ only</h2>
    <p>This is a placeholder. This prototype has no dating profiles, matching or messaging, and none will ever be shown to anyone under 18.</p></div>
   <div class="card" style="margin-top:14px"><p class="bio" style="margin:0">Your Friends and Community spaces stay completely separate from this section.</p></div>${foot()}`;
 }
};

/* ============ 8. SHEETS ============ */
function personSheet(p){
  const pc=matchPct(p),sc=sharedCount(p),inc=D().incoming.some(x=>x.id===p.id),res=S.resolved[p.id];
  let action;
  if(res==='accepted')action=`<button class="bs full" disabled>${ic('check')}Friends</button>`;
  else if(res==='declined')action=`<button class="bs full" disabled>Declined</button>`;
  else if(inc)action=`<div class="acts"><button class="bp" data-act="accept" data-id="${p.id}">${ic('check')}Accept</button><button class="bd" data-act="decline" data-id="${p.id}">${ic('x')}Decline</button></div>`;
  else if(S.sent[p.id])action=`<button class="bs full" disabled>${ic('check')}Request sent</button>`;
  else action=`<button class="bp full" data-act="send" data-id="${p.id}">Send Request</button>`;
  return `<div class="row" style="gap:14px">${avatar(p.name,'xl')}<div class="grow"><h2 style="margin:0 0 4px;font-size:22px">${esc(p.name)}, ${p.age}</h2>
    <div class="meta">${band()==='adult'?'Adult space':'Teen space'}${pc?` · <span class="mint">${pc}% interest match</span>`:''}</div></div></div>
   <p class="bio">${esc(p.bio)}</p>${tags(p.interests)}${sc?`<div class="shared">✓ ${sc} shared interest${sc>1?'s':''} with you</div>`:''}
   <div class="privnote">${ic('pin')}<span>KINDRED never shows anyone's location.</span></div>${action}
   <div class="mini"><button class="bt" data-act="report" data-id="${p.id}">${ic('flag')}Report</button><button class="bt" data-act="block" data-id="${p.id}">${ic('ban')}Block</button><button class="bt" data-act="closex">Close</button></div>`;
}
function reportSheet(p){
  const rs=['Unkind or bullying','Fake or spam profile','Inappropriate content','I feel unsafe','Something else'];
  return `<h2 style="font-size:20px">Report ${esc(p.name)}</h2><p class="meta">Reports are private. In a real app, a trained person would review each one.</p>
   ${rs.map(r=>`<button class="opt" data-act="reason" data-id="${p.id}" data-r="${esc(r)}"><span>${esc(r)}</span></button>`).join('')}
   <div class="acts"><button class="bd" data-act="block" data-id="${p.id}">${ic('ban')}Block instead</button><button class="bo" data-act="closex">Cancel</button></div>`;
}
function renderSheet(animate){
  const el=$('#sheet');
  if(!SHEET||!S.user){SHEET=null;el.innerHTML='';document.body.style.overflow='';return}
  const p=findPerson(SHEET.id);if(!p){SHEET=null;el.innerHTML='';document.body.style.overflow='';return}
  el.innerHTML=`<div class="bg ${animate?'anim':''}" data-act="closebg"><div class="sh" role="dialog" aria-modal="true"><div class="grab"></div>${SHEET.k==='report'?reportSheet(p):personSheet(p)}</div></div>`;
  document.body.style.overflow='hidden';
}

/* ============ 9. ROUTER / EVENTS ============ */
const NAV=[['friends','users','Friends'],['requests','mail','Requests'],['community','chat','Community'],['profile','user','Profile'],['dating','lock','Dating 18+',true]];
let lastKey='';
function applyTheme(){document.documentElement.dataset.theme=S.settings.theme;$('#tc').content=S.settings.theme==='dark'?'#070a1f':'#f4f3fb'}
function route(){
  applyTheme();
  const h=(location.hash||'').slice(1)||'friends',nav=$('#nav'),view=$('#view'),chip=$('#chip'),y=window.scrollY;
  let key,html;
  if(!S.user){nav.hidden=true;chip.textContent='Demo';key='welcome';html=Views.welcome()}
  else{
    const[base,arg]=h.split('/');
    if(base==='dating'&&band()!=='adult'){location.hash='#friends';return}   // safety guard: minors never reach dating
    const cur=['friends','requests','community','profile','settings','dating'].includes(base)?base:'friends';
    chip.textContent=band()==='adult'?'Adult · 18+':'Teen · 13–17';
    key=cur+'/'+(cur==='community'&&arg?arg:'');
    html=(cur==='community'&&arg)?Views.group(arg):Views[cur]();
    const navOn=cur==='settings'?'profile':cur;
    nav.hidden=false;
    nav.innerHTML=NAV.filter(n=>!n[3]||band()==='adult').map(([r,i,t])=>{const c=r==='requests'&&S.settings.reqs!=='none'?pending().length:0;
      return `<button data-go="${r}" class="${r===navOn?'on':''}" aria-label="${t}">${ic(i)}${t}${c?`<span class="badge">${c}</span>`:''}</button>`}).join('');
  }
  const changed=key!==lastKey;lastKey=key;
  view.innerHTML=html;
  if(changed){view.classList.remove('rise');void view.offsetWidth;view.classList.add('rise');window.scrollTo(0,0)}else window.scrollTo(0,y);
  renderSheet(false);
}
function signIn(name,age){resetKeepTheme();S.user={name,age,bio:'',interests:[]};save();location.hash='#friends';route()}

document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');if(go){SHEET=null;location.hash='#'+go.dataset.go;return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const{act,id}=b.dataset;
  if(act==='closebg'){if(e.target===b){SHEET=null;renderSheet()}return}
  if(act==='closex'){SHEET=null;renderSheet();return}
  if(act==='demo'){const a=+b.dataset.age;signIn(a>=18?'DemoAdult':'DemoTeen',a);return}
  if(act==='person'){SHEET={k:'person',id};renderSheet(true);return}
  if(act==='report'){SHEET={k:'report',id};renderSheet(true);return}
  if(act==='reason'){SHEET=null;renderSheet();toast(b.dataset.r==='I feel unsafe'?'Report sent. Please also tell a trusted adult.':'Report sent. Thank you (demo)');return}
  if(act==='open'){SHEET=null;location.hash='#community/'+id;return}
  if(act==='back'){location.hash='#community';return}
  if(act==='signout'){SHEET=null;resetKeepTheme();save();location.hash='';route();return}
  if(act==='send'){S.sent[id]=true;toast('Request sent (demo)')}
  else if(act==='accept'){S.resolved[id]='accepted';toast('Friend added')}
  else if(act==='decline'){S.resolved[id]='declined';toast('Request declined')}
  else if(act==='join'){S.joined[id]=!S.joined[id]}
  else if(act==='like'){S.likes[id]=!S.likes[id]}
  else if(act==='filter'){S.filter=id}
  else if(act==='ctab'){S.ctab=id}
  else if(act==='block'){S.blocked[id]=true;SHEET=null;toast('Blocked. You can undo this in Settings')}
  else if(act==='unblock'){delete S.blocked[id];toast('Unblocked')}
  else if(act==='setvis'){if(id==='public'&&band()!=='adult')return;S.settings.vis=id}
  else if(act==='setreq'){S.settings.reqs=id}
  else if(act==='tgtheme'){S.settings.theme=S.settings.theme==='dark'?'light':'dark'}
  else if(act==='tgnotif'){S.settings.notif=!S.settings.notif}
  save();route();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&SHEET){SHEET=null;renderSheet();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='signin'){
    const name=$('#nick').value.trim(),age=parseInt($('#age').value,10),err=$('#err');
    if(!name){err.textContent='Please choose a nickname.';return}
    if(!(age>=1&&age<=99)){err.textContent='Please enter a valid age.';return}
    if(age<13){err.textContent='KINDRED is for ages 13 and up. Please ask a parent or guardian about safe options for you.';return}
    signIn(name,age);return}
  if(f.id==='profile'){
    S.user.name=$('#pn').value.trim()||S.user.name;S.user.bio=$('#pb').value.trim();
    S.user.interests=$('#pi').value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,8);
    save();toast('Profile saved');route();return}
  if(f.dataset.form==='comment'){const v=f.querySelector('input').value.trim();if(!v)return;
    (S.comments[f.dataset.id]=S.comments[f.dataset.id]||[]).push({by:S.user.name,text:v});save();route();return}
  if(f.dataset.form==='post'){const v=f.querySelector('textarea').value.trim();if(!v)return;
    (S.newPosts[f.dataset.id]=S.newPosts[f.dataset.id]||[]).unshift({id:'n'+Date.now(),by:S.user.name,text:v,comments:[]});save();toast('Posted');route()}
});
window.addEventListener('hashchange',route);
route();

/* ============ 10. PWA (installable app) ============ */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
